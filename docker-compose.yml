version: "3.8"

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: student_expense_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: student_expense_db
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expense_net

  # Java Expense Server Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_expense_app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: student_expense_db
      DB_USER: root
      DB_PASSWORD: rootpassword
    ports:
      - "3000:3000"
    networks:
      - expense_net

volumes:
  mysql_data:

networks:
  expense_net:
    driver: bridge
